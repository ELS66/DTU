spring:
  application:
    name: iot-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dtu_iot}
    username: ${DB_USER:dtu}
    password: ${DB_PASSWORD:local-dev-only}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
