services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: dtu_iot
      POSTGRES_USER: dtu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dtu -d dtu_iot"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.6
    ports:
      - "127.0.0.1:6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  emqx:
    image: emqx/emqx:5.8.7
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:18083:18083"
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
